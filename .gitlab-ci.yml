# Builds the image and publishes it to this project's container registry.
# Runs on the bolha dind runners (bravo-open-*, untagged jobs).
# Tags: <version>-<pipeline id> (immutable, pin this one in k8s) and latest.
stages: [test, build]

variables:
  AGENDE_VERSION: "0.1.0"

test:
  stage: test
  image: golang:1.26-alpine
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:7.4-alpine
      alias: redis
  variables:
    CGO_ENABLED: "0"
    POSTGRES_PASSWORD: admin
    PGPASSWORD: admin
    AGENDE_TEST_DB_HOST: postgres
    AGENDE_TEST_REDIS: "redis:6379"
  before_script:
    - apk add --no-cache postgresql17-client
    - until pg_isready -h postgres -U postgres; do sleep 1; done
    - psql -h postgres -U postgres -c "CREATE ROLE agende LOGIN PASSWORD 'agende'" -c "CREATE DATABASE agende"
    - psql -h postgres -U postgres -d agende -f schema.sql
  script:
    - go vet ./...
    - go test -p 1 ./...
    - go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
    - "$(go env GOPATH)/bin/govulncheck ./..."

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -q -t "$CI_REGISTRY_IMAGE:$AGENDE_VERSION-$CI_PIPELINE_ID" .
    - docker tag "$CI_REGISTRY_IMAGE:$AGENDE_VERSION-$CI_PIPELINE_ID" "$CI_REGISTRY_IMAGE:latest"
    - docker push -q "$CI_REGISTRY_IMAGE:$AGENDE_VERSION-$CI_PIPELINE_ID"
    - docker push -q "$CI_REGISTRY_IMAGE:latest"
    - echo "published $CI_REGISTRY_IMAGE:$AGENDE_VERSION-$CI_PIPELINE_ID"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
