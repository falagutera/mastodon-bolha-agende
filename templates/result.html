{{template "head" .}}
<section class="hero">
  <p class="kicker">{{.T.kicker}}</p>
  <h1>{{.T.result_title}}</h1>
</section>
<ul class="results card">
{{range .Results}}  <li class="{{if .OK}}ok{{else}}no{{end}}">{{.When}}: {{if .OK}}{{$.T.result_ok}}{{else}}{{$.T.result_no}}{{end}}</li>
{{end}}</ul>
<p><a class="btn secondary" href="/queue">{{.T.back_queue}}</a></p>
{{template "foot" .}}
