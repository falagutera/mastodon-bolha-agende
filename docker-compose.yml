# Put it behind your usual reverse proxy. Settings go in .env (see .env.example).
services:
  agende:
    build: .
    image: agende:local
    container_name: agende
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs: ["/tmp:size=400m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [postgres, redis]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: postgres.env
    environment:
      POSTGRES_DB: agende
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${AGENDE_REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
